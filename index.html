<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c10" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f8" />
    <meta name="description" content="Find your people. Go play." />
    <title>Sports Buddy</title>
    <script>
      // Applies the stored theme before first paint. Key: src/constants/app.ts
      try {
        var stored = localStorage.getItem('sports-buddy.theme')
        var dark =
          stored === 'dark' ||
          ((!stored || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (error) {
        void error
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
